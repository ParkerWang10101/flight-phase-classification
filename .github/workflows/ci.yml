name: Core package checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        profile: ["core", "models"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install core development dependencies
        if: matrix.profile == 'core'
        run: python -m pip install ".[dev,parquet]"
      - name: Install CPU PyTorch
        if: matrix.profile == 'models'
        run: python -m pip install "torch>=2.6,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install model development dependencies
        if: matrix.profile == 'models'
        run: python -m pip install ".[dev,parquet,tcn,rf,decoding]"
      - name: Build source and wheel distributions
        run: python -m build --outdir temp/dist
      - name: Install the built wheel
        run: python -m pip install --force-reinstall --no-deps temp/dist/*.whl
      - name: Test the installed package
        run: python -m pytest -q

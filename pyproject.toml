[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-phase-classification"
version = "0.1.0"
description = "Core package for ADS-B flight-phase recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2,<2", "pytest>=8,<10"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["flight_phase", "flight_phase.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --import-mode=importlib"
